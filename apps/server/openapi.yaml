openapi: 3.1.0
info:
  title: API Developer Portal — control-plane API
  version: 0.1.0
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    Control-plane API for the portal server (`apps/server`). This file is the contract:
    change it before the handlers, then regenerate `packages/sdk`.

    - Base path: every operation is served under `/api` (the portal's Next.js app rewrites
      `/api/*` to the server so browser calls are same-origin and use the session cookie).
    - Authentication: Better Auth owns `/api/auth/*` (session cookie). Those routes are not
      described here; the portal uses `sign-up/email`, `sign-in/email`, `sign-out`, `get-session`,
      `send-verification-email`, `verify-email`, `request-password-reset`, `reset-password`
      (GET with a token, and POST) and `change-password`. The server puts per-address limits in
      front of three of them (spec 007, ADR 0007). Over a limit the response is a 429
      `/problems/rate-limited` with `Retry-After` (seconds), before Better Auth is called:
      - `sign-in/email`: failed sign-ins per email address (default 10 in 15 minutes). A wrong
        current password on `change-password` or `DELETE /v1/me` counts as a failed sign-in.
      - `request-password-reset`: requests per email address, whether or not it has an account
        (default 3 per hour).
      - `send-verification-email`: requests per account, shared with `POST /v1/me/email`
        (default 3 per hour). The email sent at sign-up doesn't count.
      `forget-password` (Better Auth's old name for `request-password-reset`) answers 404, and
      `change-password` always revokes the user's other sessions, as does a password reset.
      Better Auth's `change-email` and `delete-user` are disabled; the portal's own
      `/v1/me/email` and `DELETE /v1/me` replace them.
      Operations marked `sessionCookie` need a signed-in user; `/v1/admin/*` also needs
      `role = admin`.
      Until the first admin exists, `/api/auth/sign-up/email` refuses every request; the first
      admin is created with `POST /v1/setup/admin` (spec 005).
    - Errors are RFC 9457 `application/problem+json` with a relative `type` URI such as
      `/problems/gateway-unavailable`.
    - IDs are UUIDv7. Timestamps are UTC ISO 8601 (`date-time`).
    - Secrets are never returned, except a new API key, exactly once, in the response that
      creates it.
    - Apps belong to a team, not a person (spec 008, ADR 0008). Roles are `admin`, `member` and
      `read-only`. Access is membership in the app's team, checked on every request. A caller who
      isn't a member gets 404 (`/problems/not-found`), and a member whose role is too low gets 403
      (`/problems/team-role-forbidden`). Membership changes never call the gateway.
    - An API has one or more versions (spec 012, ADR 0007). Exactly one is the latest; the
      unversioned catalog paths serve it. Versions are named by the document's `info.version`.
servers:
  - url: /api
tags:
  - name: system
    description: Health
  - name: catalog
    description: Public API catalog and published OpenAPI documents
  - name: me
    description: The signed-in user
  - name: apps
    description: A team's apps and their API keys (spec 008, ADR 0008)
  - name: teams
    description: Teams, members and invitations (spec 008, ADR 0008)
  - name: setup
    description: First-run setup (spec 005, ADR 0006)
  - name: admin
    description: Admin-only operations
  - name: gateways
    description: The gateway connection (spec 005, ADR 0006). One per install until spec 017.
  - name: try-it
    description: Proxy used by the try-it console (ADR 0003)

paths:
  /v1/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Server and gateway health
      security: []
      responses:
        '200':
          description: |
            Server is up, with or without a gateway. `gateway` is null when none is connected;
            otherwise `gateway.reachable` reports Kong's Admin API. `status` is `degraded`
            when the operator's lint ruleset (`PORTAL_LINT_RULESET`) failed to load; `lint.error`
            names the file and the problem, and imports answer 503 until it is fixed and the server
            restarted. The status code stays 200 so the published docs keep being served.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /v1/health/live:
    get:
      tags: [system]
      operationId: getLiveness
      summary: Liveness probe
      description: |
        Answers 200 while the process can serve HTTP. It checks nothing else, not the database
        and not the gateway, so a database outage never makes Kubernetes or Compose restart the
        server (spec 016).
      security: []
      responses:
        '200':
          description: The process is up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Liveness' }

  /v1/health/ready:
    get:
      tags: [system]
      operationId: getReadiness
      summary: Readiness probe
      description: |
        Answers 200 when the server can reach PostgreSQL (`select 1`, 2-second timeout), and 503
        when it cannot. The gateway is not checked: a portal without Kong is still ready. When
        the database returns, the next check answers 200 again without a restart (spec 016).
      security: []
      responses:
        '200':
          description: Ready to serve requests
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: |
            The database is unreachable (`/problems/database-unavailable`). The body never
            contains the database URL, host or credentials.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/setup:
    get:
      tags: [setup]
      operationId: getSetupStatus
      summary: Whether this install still needs its first admin
      description: |
        Public, so the portal can send every page to the setup screen. Reveals nothing secret.
      security: []
      responses:
        '200':
          description: Setup status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupStatus' }

  /v1/setup/admin:
    post:
      tags: [setup]
      operationId: createFirstAdmin
      summary: Create the first admin and sign them in
      description: |
        Atomic and serialized: of any number of submissions, at the same time or later, exactly
        one creates an admin. The response sets the session cookie. When
        `NODE_ENV=production`, `setupToken` must match the install's setup token, which every
        server replica prints to its log at start (spec 016, ADR 0009). The token is stored once,
        encrypted, in a single database row created while no admin exists; restarts and other
        replicas print the same token. A successful claim deletes the row in the same
        transaction, after which every replica answers 409. Rate-limited to 10 requests per
        minute per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFirstAdminRequest' }
      responses:
        '201':
          description: Admin created and signed in
          headers:
            Set-Cookie:
              schema: { type: string }
              description: Better Auth session cookie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403':
          description: |
            The setup token is missing or wrong, or no token row exists yet
            (`/problems/setup-token-invalid`; restart the server to create one). No admin was created.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: An admin already exists (`/problems/setup-complete`). Nothing was changed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/apis:
    get:
      tags: [catalog]
      operationId: listApis
      summary: List published APIs (public catalog)
      security: []
      responses:
        '200':
          description: Published APIs, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ApiSummary' }

  /v1/apis/{slug}:
    get:
      tags: [catalog]
      operationId: getApi
      summary: Get one published API
      security: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: The API
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/apis/{slug}/openapi.json:
    get:
      tags: [catalog]
      operationId: getApiDocument
      summary: OpenAPI document of the latest version, ready for the API reference
      description: |
        The latest version's stored, validated document, with two changes made when it is served:
        `servers` is replaced by a single entry with the API's public gateway base URL, and
        if the document has no `apiKey` security scheme, a `portalApiKey` scheme
        (`in: header`, `name: apikey`, Kong's default) is added and applied at the top level.
        If the document has an `apiKey` scheme but no top-level `security`, the first `apiKey`
        scheme is applied at the top level, so the reference shows its key field (spec 003).
        Operation-level `security`, including `security: []`, is left as written.
      security: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: OpenAPI 3.x document as JSON
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/apis/{slug}/versions/{version}/openapi.json:
    get:
      tags: [catalog]
      operationId: getApiVersionDocument
      summary: OpenAPI document of one version, ready for the API reference
      description: |
        Same transformation as `getApiDocument` (servers replaced, `portalApiKey` added when
        needed). Every version shares the API's gateway base URL: the portal documents versions,
        it doesn't route them (spec 012, out of scope).
      security: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Version'
      responses:
        '200':
          description: OpenAPI 3.x document as JSON
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/apis/{slug}/changelog:
    get:
      tags: [catalog]
      operationId: getApiChangelog
      summary: The API's changelog, one entry per version
      description: |
        Newest import first. Each entry's `changes` was computed once, when that version was
        imported, against the version just below it in the version order (see
        `ApiDetail.versions`); it never changes afterwards, including when the latest version
        changes.
      security: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Changelog entries
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ChangelogEntry' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: The signed-in user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [me]
      operationId: updateMe
      summary: Change the signed-in user's name
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [me]
      operationId: deleteMe
      summary: Delete the signed-in user's account, its apps and their keys
      description: |
        Spec 007 AC 9 and spec 008 AC 8. Checks in this order: password (403
        `/problems/invalid-password`, counted as a failed sign-in), last portal admin (409
        `/problems/last-admin`), last Admin of a team that has other members (409
        `/problems/team-needs-admin`, with `teams` naming them), then a gateway health check
        (503 `/problems/gateway-unavailable`, nothing deleted). It then deletes the teams where
        the user is the only member (their personal team, and any shared team they are alone in):
        each of those teams' apps loses its Kong consumer (with its keys and ACL memberships) and
        its rows, one app at a time, then the team. Finally it deletes the user with their
        sessions and their other memberships. Apps of teams with other members are not touched,
        and their keys keep working. If Kong fails part way, apps already removed stay
        removed (their keys no longer work), the account and the remaining apps stay, and the
        call returns 503 so a retry finishes the job. On success the session cookie is cleared and
        the email address can sign up again as a new account.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteMeRequest' }
      responses:
        '204':
          description: Account deleted and signed out
          headers:
            Set-Cookie:
              schema: { type: string }
              description: Expires the session cookie
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The password is wrong (`/problems/invalid-password`). Nothing was deleted.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            This is the only portal admin (`/problems/last-admin`); another admin must exist first.
            Or this is the only Admin of a team that has other members
            (`/problems/team-needs-admin`; `teams` lists them). Nothing was deleted.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { $ref: '#/components/responses/GatewayRejected' }
        '503':
          description: |
            Kong's Admin API is unreachable (`/problems/gateway-unavailable`, `detail` says the
            account was not deleted). Includes `Retry-After: 5`.
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/me/current-team:
    put:
      tags: [me, teams]
      operationId: setCurrentTeam
      summary: Switch the signed-in user's current team
      description: |
        Spec 008 AC 2. The current team is the membership selected most recently. It is stored
        server-side, so it survives sign-out and is the same on every device. API calls still
        name their team explicitly.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetCurrentTeamRequest' }
      responses:
        '204': { description: Current team changed }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/me/email:
    post:
      tags: [me]
      operationId: requestEmailChange
      summary: Start changing the signed-in user's email address
      description: |
        Spec 007 AC 7. Sends a confirmation link to `newEmail` and records it as `pendingEmail`.
        The account keeps its current address, and signs in with it, until the link is opened.
        A new request replaces any pending one (the old link stops working). Counts against the
        per-account verification email limit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailChangeRequest' }
      responses:
        '202':
          description: Confirmation email queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: |
            `/problems/email-unavailable`: the address belongs to another account or is the
            current one. `detail` says only that the address can't be used.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/me/email/confirm:
    post:
      tags: [me]
      operationId: confirmEmailChange
      summary: Confirm an email change with the token from the emailed link
      description: |
        No session needed: the link may be opened on another device. On success the account's
        email becomes the new address, verified, and sign-in works only with it. Single use.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: Email changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400':
          description: |
            `/problems/link-expired`: the token is unknown, used, replaced or more than 24 hours
            old. Nothing changed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: The address was taken by another account meanwhile (`/problems/email-unavailable`). Nothing changed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/apps:
    get:
      tags: [apps]
      operationId: listApps
      summary: List a team's apps
      description: Any role. Without `teamId`, lists the caller's current team.
      parameters:
        - name: teamId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Apps, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/App' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [apps]
      operationId: createApp
      summary: Create an app, subscribe it to APIs and issue its first API key
      description: |
        Atomic from the developer's point of view (spec 001 AC 6 and 8, spec 004 AC 8). The
        server upserts the Kong consumer, grants access to each subscribed API, issues the
        key-auth credential, then writes Postgres in one transaction. On any failure it deletes
        whatever it created in Kong and stores nothing, so a retry creates exactly one consumer.
        The returned `credential.key` is never shown again. The key works only on the APIs in
        `apiIds`; Kong answers 403 on every other key-auth service (ADR 0005).
        The app belongs to `teamId` (default: the caller's current team), and needs the
        `admin` or `member` role there (spec 008). The role is checked before email verification
        and before any gateway call.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAppRequest' }
      responses:
        '201':
          description: App created, with its first key
          headers:
            Location:
              schema: { type: string }
              description: /api/v1/apps/{appId}
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateAppResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TeamForbiddenOrNotVerified' }
        '404':
          description: One of `apiIds` is not a published API, or the caller isn't a member of `teamId`
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            The team already has an app with this name (`/problems/app-name-taken`), or the
            API's gateway connection is disabled (`/problems/gateway-disabled`). When disabled,
            nothing is created in Kong or Postgres.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '502': { $ref: '#/components/responses/GatewayRejected' }
        '503': { $ref: '#/components/responses/GatewayUnavailable' }

  /v1/apps/{appId}:
    get:
      tags: [apps]
      operationId: getApp
      summary: Get one of a team's apps
      description: Any role in the app's team. Anyone else gets 404, including a removed member.
      parameters:
        - $ref: '#/components/parameters/AppId'
      responses:
        '200':
          description: The app
          content:
            application/json:
              schema: { $ref: '#/components/schemas/App' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/apps/{appId}/credentials:
    post:
      tags: [apps]
      operationId: createCredential
      summary: Issue another API key for an app
      description: |
        The returned `key` is shown once and never stored by the portal. The consumer and its
        access are upserted first, so this also works when the connection now points at a Kong
        that doesn't have the app's consumer yet (spec 005 AC 7(e)). Needs the `admin` or
        `member` role in the app's team; `read-only` gets 403 and nothing changes in Kong or
        Postgres (spec 008 AC 4).
      parameters:
        - $ref: '#/components/parameters/AppId'
      responses:
        '201':
          description: Key issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedCredential' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TeamForbiddenOrNotVerified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `type` is one of `/problems/credential-limit` (the app already has 5 active keys),
            `/problems/gateway-disabled` (the connection is disabled) or
            `/problems/gateway-not-connected` (no gateway exists). Nothing was created.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '502': { $ref: '#/components/responses/GatewayRejected' }
        '503': { $ref: '#/components/responses/GatewayUnavailable' }

  /v1/apps/{appId}/credentials/{credentialId}:
    delete:
      tags: [apps]
      operationId: revokeCredential
      summary: Revoke an API key
      description: |
        Deletes the key-auth credential in Kong, then marks the credential `revoked`.
        Idempotent: revoking an already revoked key returns 204. If Kong is unreachable
        the key stays `active` and the call returns 503, so the UI never shows a key as
        revoked while Kong still accepts it. Needs the `admin` or `member` role in the app's
        team; `read-only` gets 403 and the key stays active (spec 008 AC 4). Any member may
        revoke any of the team's keys, whoever created them.
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/CredentialId'
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TeamRoleForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/GatewayRejected' }
        '503': { $ref: '#/components/responses/GatewayUnavailable' }

  /v1/teams:
    get:
      tags: [teams]
      operationId: listTeams
      summary: The signed-in user's teams
      description: Personal team first, then by name. Creates the personal team if it is missing.
      responses:
        '200':
          description: Teams and the current one
          content:
            application/json:
              schema:
                type: object
                required: [items, currentTeamId]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TeamSummary' }
                  currentTeamId: { type: string, format: uuid }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [teams]
      operationId: createTeam
      summary: Create a team
      description: Spec 008 AC 2. The caller becomes its Admin, and it becomes their current team.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTeamRequest' }
      responses:
        '201':
          description: Team created
          headers:
            Location:
              schema: { type: string }
              description: /api/v1/teams/{teamId}
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/teams/{teamId}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [teams]
      operationId: getTeam
      summary: A team with its members and, for Admins, its pending invitations
      responses:
        '200':
          description: The team
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/teams/{teamId}/invitations:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    post:
      tags: [teams]
      operationId: createInvitation
      summary: Invite someone to the team by email
      description: |
        Spec 008 AC 3. Admin only. Emails a single-use link, valid 7 days, to `email` (trimmed and
        lowercased). Checks in this order: validation, membership (404) and role (403
        `/problems/team-role-forbidden`), personal team, mail settings, rate limit (20 an hour per
        user), already a member, pending invitation. A refused request stores nothing and
        sends nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInvitationRequest' }
      responses:
        '201':
          description: Invitation created and email queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TeamRoleForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `type` is one of `/problems/personal-team` (personal teams take no invitations),
            `/problems/mail-not-configured` (no mail settings, so nobody would get the email),
            `/problems/already-member` (the address belongs to a member) or
            `/problems/invitation-pending` (that address already has a pending invitation to this
            team; cancel it to invite again).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/teams/{teamId}/invitations/{invitationId}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/InvitationId'
    delete:
      tags: [teams]
      operationId: cancelInvitation
      summary: Cancel a pending invitation
      description: Admin only. Its link stops working at once. Cancelling a cancelled or expired invitation returns 204.
      responses:
        '204': { description: Cancelled }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TeamRoleForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Already accepted (`/problems/invitation-used`). Remove the member instead.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/teams/{teamId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [teams]
      operationId: updateTeamMember
      summary: Change a member's role
      description: |
        Admin only (spec 008 AC 9). Applies on the member's next request. Refused with
        `/problems/team-needs-admin` if it would leave the team with no Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTeamMemberRequest' }
      responses:
        '200':
          description: The member with the new role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMember' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TeamRoleForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TeamNeedsAdmin' }
    delete:
      tags: [teams]
      operationId: removeTeamMember
      summary: Remove a member, or leave the team
      description: |
        An Admin may remove anyone; any member may remove themselves (leave). Only the
        membership is deleted: the team's apps, keys and Kong consumers are unchanged, including
        keys this member created (spec 008 AC 7). Refused with `/problems/team-needs-admin` for
        the last Admin.
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TeamRoleForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TeamNeedsAdmin' }

  /v1/invitations/preview:
    post:
      tags: [teams]
      operationId: previewInvitation
      summary: Show what an invitation link is for
      description: |
        No session needed: the invitee may not have an account yet. The token is in the body so
        it never appears in access logs. Changes nothing.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationTokenRequest' }
      responses:
        '200':
          description: The invitation, in any state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationPreview' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/invitations/accept:
    post:
      tags: [teams]
      operationId: acceptInvitation
      summary: Accept an invitation and join the team
      description: |
        Spec 008 AC 3 and 6. The signed-in account's email must equal the invited address
        (case-insensitive). On success the membership is created with the invited role, the team
        becomes the current team, and the account's email is marked verified (the token reached
        that inbox). On any refusal nothing changes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationTokenRequest' }
      responses:
        '200':
          description: Joined
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `type` is one of `/problems/invitation-cancelled`, `/problems/invitation-used`,
            `/problems/invitation-expired` or `/problems/invitation-wrong-account` (signed in with
            another address; the invitation stays pending).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/admin/gateway/services:
    get:
      tags: [admin]
      operationId: listGatewayServices
      summary: List Kong services that an imported spec can be linked to
      description: |
        Leaves out services tagged `portal-internal`, such as the protected Admin API route from
        the docs recipe. The import screen calls this before showing its form. On a disabled
        connection it makes no request to Kong and returns `/problems/gateway-disabled`, so the
        service list isn't offered (spec 005 AC 7(b)).
      responses:
        '200':
          description: Services with their routes
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/GatewayService' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            `type` is one of `/problems/gateway-not-connected` (no gateway exists; the detail points
            to Admin → Gateways) or `/problems/gateway-disabled` (the connection is disabled).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '502': { $ref: '#/components/responses/GatewayRejected' }
        '503': { $ref: '#/components/responses/GatewayUnavailable' }

  /v1/admin/apis:
    post:
      tags: [admin]
      operationId: importApi
      summary: Import an OpenAPI 3.x document, link it to a Kong service and publish it
      description: |
        Validates the document (OpenAPI 3.0 or 3.1 only; Swagger 2.0 is rejected), lints it
        with the active Spectral ruleset (spec 012, ADR 0007) and bundles external `$ref`s. On
        success the API is published to the public catalog with the document as its first and
        latest version. On a validation or lint error nothing is stored. Lint warnings don't
        block; they are returned in `lintWarnings`.

        If the service is already linked to a published API, the refusal
        (`/problems/gateway-service-already-linked`) names that API; publish the document as a
        new version of it with `POST /v1/admin/apis/{slug}/versions` instead.

        Publishing applies access control to the linked service (ADR 0005): an `allow` ACL for
        the service's portal group, and `hide_credentials` on its key-auth plugins. Existing keys
        get 403 until their app subscribes, and so do non-portal consumers until the operator adds
        them to the group `portal-svc-<serviceId>`. A service without key-auth gets no ACL and
        publishes with an `api-public` warning. Kong applies plugin changes within about 5 seconds.

        On a disabled connection the import is refused with `/problems/gateway-disabled` before the
        body is validated, `spec.url` is fetched or Kong is called, and nothing is left behind
        (spec 005 AC 7(b)).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportApiRequest' }
      responses:
        '201':
          description: Imported and published
          headers:
            Location:
              schema: { type: string }
              description: /api/v1/apis/{slug}
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportedApi' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            Slug already used (`/problems/api-slug-taken`), no gateway is connected
            (`/problems/gateway-not-connected`), or the connection is disabled
            (`/problems/gateway-disabled`). Nothing was created in Kong or Postgres.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413':
          description: Document larger than 5 MiB (`/problems/document-too-large`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            The document cannot be published. `type` is one of
            `/problems/openapi-lint-failed` (one or more error-severity lint findings; `errors`
            lists each with `rule`, `message`, `pointer`, `line` and `column`, up to 100),
            `/problems/invalid-openapi` (parse or schema error; `errors[0]` is the first one;
            for a YAML or JSON syntax error it has `line` and `column`),
            `/problems/unsupported-openapi-version` (not 3.0.x or 3.1.x),
            `/problems/invalid-api-version` (`info.version` is missing or doesn't match
            `ApiVersionName`; it is used in URLs),
            `/problems/slug-required` (no `slug` was given and none can be derived from
            `info.title`, for example a title with no ASCII letters or digits;
            `errors[0].pointer` is `/slug`),
            `/problems/spec-url-unreachable` (fetching `spec.url` failed or timed out after 10 s),
            `/problems/gateway-service-not-found`,
            `/problems/gateway-service-has-no-route` (no route with a path, and no `routePath` given),
            `/problems/gateway-service-has-acl` (an ACL plugin the portal didn't create applies to the
            service, globally or on the service or one of its routes; `detail` names the service, and
            its plugins are unchanged),
            `/problems/gateway-service-already-linked` (another published API uses this service;
            `detail` names that API's slug).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '502': { $ref: '#/components/responses/GatewayRejected' }
        '503':
          description: |
            `/problems/gateway-unavailable` (see `GatewayUnavailable`), or
            `/problems/lint-ruleset-unavailable`: the operator's ruleset failed to load at startup,
            so nothing can be imported until it is fixed and the server restarted. The portal never
            falls back to the default ruleset.
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/admin/apis/{slug}/versions:
    post:
      tags: [admin]
      operationId: importApiVersion
      summary: Publish a new version of an existing API
      description: |
        Validates and lints the document exactly like `importApi`, computes the change summary
        against the previous version (see `ChangelogEntry`), and stores the version. No gateway
        call is made: every version shares the API's Kong service and route, and access is per
        API, so this works while Kong is unreachable.

        With `makeLatest` true (the default) the new version becomes the latest, even when its
        number is lower than the current latest (spec 012 AC 2). With `makeLatest` false it is
        published and listed, and the latest is unchanged. On any refusal nothing is stored.
      parameters:
        - $ref: '#/components/parameters/Slug'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportApiVersionRequest' }
      responses:
        '201':
          description: Version published
          headers:
            Location:
              schema: { type: string }
              description: /api/v1/apis/{slug}/versions/{version}/openapi.json
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportedApiVersion' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The API already has a version with this `info.version` (`/problems/api-version-exists`;
            `detail` names it). The published version is unchanged.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413':
          description: Document larger than 5 MiB (`/problems/document-too-large`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            The document cannot be published: `/problems/openapi-lint-failed`,
            `/problems/invalid-openapi`, `/problems/unsupported-openapi-version`,
            `/problems/invalid-api-version` or `/problems/spec-url-unreachable`, as for `importApi`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: '`/problems/lint-ruleset-unavailable` (see `importApi`)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/admin/apis/{slug}/latest-version:
    put:
      tags: [admin]
      operationId: setLatestApiVersion
      summary: Make an existing version the latest
      description: |
        "Set as latest" (spec 012 AC 9). Idempotent: naming the current latest returns 200 and
        changes nothing. The catalog title and description follow the latest version's `info`.
        No gateway call is made. Changelog entries are not recomputed.
      parameters:
        - $ref: '#/components/parameters/Slug'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetLatestVersionRequest' }
      responses:
        '200':
          description: The API, with its new latest version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such API, or it has no version with that name (`/problems/not-found`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/admin/gateways:
    get:
      tags: [gateways]
      operationId: listGateways
      summary: The gateway connection, and the bundled Kong's values if this install has one
      responses:
        '200':
          description: At most one item until spec 017. Never includes the admin token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [gateways]
      operationId: createGateway
      summary: Check and save the gateway connection
      description: |
        Runs the same checks as `testGateway`, then saves. The portal uses the connection from the
        next request, with no restart, and queues a reconcile. On any failure nothing is saved.
        A refused second add makes no request to the supplied URL.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGatewayRequest' }
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gateway' }
        '400': { $ref: '#/components/responses/GatewayFieldInvalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: A gateway already exists; a portal connects to one (`/problems/gateway-exists`). It is unchanged.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/GatewayCheckFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/admin/gateways/test:
    post:
      tags: [gateways]
      operationId: testGateway
      summary: Check connection values without saving anything
      description: |
        Read-only: it makes GET requests only and changes nothing in Kong or Postgres. Failure
        messages never contain the token or a response body. Rate-limited to 30 requests per minute
        per admin. Pass `gatewayId` when editing, so a blank token can use the stored one if the
        Admin API URL is unchanged. With a changed URL and a stored token, a blank token gets
        `/problems/gateway-token-required` and the stored token is never sent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestGatewayRequest' }
      responses:
        '200':
          description: All checks passed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayTestResult' }
        '400': { $ref: '#/components/responses/GatewayFieldInvalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/GatewayCheckFailed' }
        '503':
          description: The stored admin token cannot be decrypted (`/problems/gateway-unavailable`). Enter the token again before testing or saving. No outbound request is made.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/admin/gateways/{gatewayId}:
    parameters:
      - $ref: '#/components/parameters/GatewayId'
    patch:
      tags: [gateways]
      operationId: updateGateway
      summary: Edit, disable or re-enable the connection
      description: |
        A change to only `enabled: false` makes no request to Kong, so a connection to a Kong that
        is down can still be disabled. Every other change runs the same checks as `testGateway`
        first. On any failure nothing is saved and the existing connection keeps working. That
        includes `enabled: true`: if a check fails, the response names that case and the connection
        stays disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateGatewayRequest' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gateway' }
        '400': { $ref: '#/components/responses/GatewayFieldInvalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `type` is `/problems/gateway-env-managed` (set by environment variables, so read-only)
            or `/problems/gateway-keys-missing` (`affectedKeys` active keys have no consumer on this
            Kong; send `confirmMissingKeys: true` to save anyway). Nothing was saved.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/GatewayCheckFailed' }
        '503':
          description: The stored admin token cannot be decrypted (`/problems/gateway-unavailable`). Enter the token again before testing or saving. No outbound request is made.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [gateways]
      operationId: deleteGateway
      summary: Remove the connection and its stored token
      description: |
        Makes no request to Kong. The portal's objects stay there, including its ACLs, so traffic is
        unchanged; the docs describe tag-based cleanup.
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `type` is `/problems/gateway-env-managed` or `/problems/gateway-in-use`. For the second,
            `apis` and `activeKeys` say how many depend on it. Nothing was removed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/admin/gateways/{gatewayId}/sample:
    parameters:
      - $ref: '#/components/parameters/GatewayId'
    post:
      tags: [gateways]
      operationId: addSampleApi
      summary: Publish the sample API on the bundled Kong
      description: |
        Only when the connection is enabled, its Admin API URL equals the bundled Kong's and no API
        has the slug `sample` (`Gateway.sampleAvailable`). The sample's upstream exists only in the
        bundled compose network.
      responses:
        '201':
          description: Published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `type` is `/problems/gateway-disabled` (the connection is disabled; this is checked first)
            or `/problems/sample-not-available` (this gateway can't take the sample). Nothing was created.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '502': { $ref: '#/components/responses/GatewayRejected' }
        '503': { $ref: '#/components/responses/GatewayUnavailable' }

  /v1/admin/settings/mail:
    get:
      tags: [admin]
      operationId: getMailSettings
      summary: How the portal sends email
      description: |
        `source` says which settings are in use: `saved` (admin UI, these win), `environment`
        (the `SMTP_*` variables, used while nothing is saved) or `none`. The SMTP password is never
        returned; `hasPassword` says whether one is stored.
      responses:
        '200':
          description: Mail settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [admin]
      operationId: saveMailSettings
      summary: Save SMTP settings; from now on they win over the environment
      description: |
        Doesn't contact the SMTP server; use the test action for that. The password is encrypted
        at rest (AES-256-GCM with `PORTAL_ENCRYPTION_KEY`). Omit `password` to keep the stored one;
        send `null` to remove it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveMailSettingsRequest' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailSettings' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [admin]
      operationId: deleteMailSettings
      summary: Remove the saved SMTP settings and go back to the environment ones
      responses:
        '200':
          description: Removed; the response shows what is now in use
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            "Require a verified email" is on and the environment has no SMTP settings, so removing
            these would leave no way to send mail (`/problems/mail-required`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/admin/settings/mail/test:
    post:
      tags: [admin]
      operationId: sendTestEmail
      summary: Send a test email with the settings in use
      description: |
        Sends synchronously and gives up after 15 seconds. Error `detail`s are fixed copy and
        never include the SMTP server's reply, the username or the password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              additionalProperties: false
              properties:
                to: { type: string, format: email, maxLength: 254 }
      responses:
        '200':
          description: The SMTP server accepted the message
          content:
            application/json:
              schema:
                type: object
                required: [to, source]
                properties:
                  to: { type: string, format: email }
                  source: { type: string, enum: [saved, environment] }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: No SMTP settings are saved or set in the environment (`/problems/mail-not-configured`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            The SMTP server didn't take the message. `type` is one of
            `/problems/smtp-unreachable` (DNS, connection, TLS or timeout),
            `/problems/smtp-auth-failed` (the server rejected the username or password),
            `/problems/smtp-rejected` (connected and signed in, but the sender or recipient was refused).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/admin/settings/accounts:
    get:
      tags: [admin]
      operationId: getAccountSettings
      summary: Email verification requirement and rate limits
      responses:
        '200':
          description: Account settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [admin]
      operationId: saveAccountSettings
      summary: Change the verification requirement and rate limits
      description: Takes effect on the next request, without a restart. Send the whole object.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveAccountSettingsRequest' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountSettings' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            Turning on `requireVerifiedEmail` with no SMTP settings saved or in the environment
            (`/problems/mail-not-configured`). Nothing was saved.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/try-it:
    parameters:
      - name: scalar_url
        in: query
        required: true
        description: Absolute target URL. Must start with a published API's `gatewayBaseUrl`.
        schema: { type: string, format: uri }
    get:
      tags: [try-it]
      operationId: tryItGet
      summary: Forward a try-it request to the gateway
      description: |
        Scalar's proxy protocol (ADR 0003). Forwards the method, body and allowed headers to
        the gateway (public base URL rewritten to the internal one) and passes the gateway's
        status, headers and body back unchanged; for example, Kong's 401 is returned as a 401.
        The one exception is Kong's own access-control refusal: the status stays 403 and the
        headers pass through, but the body becomes the `/problems/api-access-denied` problem, so
        the console can say what to do next. A 403 from the upstream service passes unchanged.
        No session needed. Rate-limited to 60 requests per minute per IP. Strips cookies,
        doesn't follow redirects, caps bodies at 1 MiB, 10 s timeout.
        POST, PUT, PATCH and DELETE behave the same way.
      security: []
      responses:
        '400': { $ref: '#/components/responses/TryItNotAllowed' }
        '403': { $ref: '#/components/responses/TryItAccessDenied' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '504': { $ref: '#/components/responses/TryItTimeout' }
        default:
          description: The gateway's response, passed through unchanged
    post:
      tags: [try-it]
      operationId: tryItPost
      summary: Forward a try-it request to the gateway (see GET)
      security: []
      requestBody:
        required: false
        content:
          '*/*':
            schema: {}
      responses:
        '400': { $ref: '#/components/responses/TryItNotAllowed' }
        '403': { $ref: '#/components/responses/TryItAccessDenied' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '504': { $ref: '#/components/responses/TryItTimeout' }
        default:
          description: The gateway's response, passed through unchanged
    put:
      tags: [try-it]
      operationId: tryItPut
      summary: Forward a try-it request to the gateway (see GET)
      security: []
      requestBody:
        required: false
        content:
          '*/*':
            schema: {}
      responses:
        '400': { $ref: '#/components/responses/TryItNotAllowed' }
        '403': { $ref: '#/components/responses/TryItAccessDenied' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '504': { $ref: '#/components/responses/TryItTimeout' }
        default:
          description: The gateway's response, passed through unchanged
    patch:
      tags: [try-it]
      operationId: tryItPatch
      summary: Forward a try-it request to the gateway (see GET)
      security: []
      requestBody:
        required: false
        content:
          '*/*':
            schema: {}
      responses:
        '400': { $ref: '#/components/responses/TryItNotAllowed' }
        '403': { $ref: '#/components/responses/TryItAccessDenied' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '504': { $ref: '#/components/responses/TryItTimeout' }
        default:
          description: The gateway's response, passed through unchanged
    delete:
      tags: [try-it]
      operationId: tryItDelete
      summary: Forward a try-it request to the gateway (see GET)
      security: []
      requestBody:
        required: false
        content:
          '*/*':
            schema: {}
      responses:
        '400': { $ref: '#/components/responses/TryItNotAllowed' }
        '403': { $ref: '#/components/responses/TryItAccessDenied' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '504': { $ref: '#/components/responses/TryItTimeout' }
        default:
          description: The gateway's response, passed through unchanged

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Better Auth session cookie set by /api/auth/sign-in/email or /sign-up/email

  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Slug' }
    AppId:
      name: appId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Version:
      name: version
      in: path
      required: true
      description: A version's `info.version`, URL-encoded (`+` becomes `%2B`)
      schema: { $ref: '#/components/schemas/ApiVersionName' }
    GatewayId:
      name: gatewayId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TeamId:
      name: teamId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    ValidationError:
      description: Request body or parameters failed validation (`/problems/validation`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Not signed in (`/problems/unauthenticated`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Signed in but not an admin (`/problems/forbidden`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not found, or not owned by the caller (`/problems/not-found`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TeamRoleForbidden:
      description: |
        The caller is a member of the team but their role doesn't allow this
        (`/problems/team-role-forbidden`). Nothing was changed, in Kong or the portal.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TeamForbiddenOrNotVerified:
      description: |
        `/problems/team-role-forbidden` (the caller is `read-only` in the team; checked first) or
        `/problems/email-not-verified` (the admin requires a verified email and the user hasn't
        verified theirs; the UI offers to resend it with `POST /api/auth/send-verification-email`).
        Nothing was created, in Kong or the portal.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TeamNeedsAdmin:
      description: |
        This would leave the team with no Admin (`/problems/team-needs-admin`). Make another member
        an Admin first. Nothing was changed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    GatewayUnavailable:
      description: |
        Kong's Admin API is unreachable, timed out (5 s) or returned 5xx
        (`/problems/gateway-unavailable`). Nothing was changed; it is safe to retry.
        Includes `Retry-After: 5`.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    GatewayFieldInvalid:
      description: |
        A field is malformed, isn't http(s), carries credentials, a query or a fragment, or resolves
        to a link-local or cloud metadata address (`/problems/validation`). `errors[].pointer` names
        the field, such as `/adminUrl`. The portal made no request to a refused address.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    GatewayCheckFailed:
      description: |
        A connection check failed and nothing was saved. Messages contain neither the token nor a
        response body. `type` is one of:
        `/problems/gateway-unreachable` (network error, 5 s timeout or 5xx; for `localhost`, the detail
        says the address is resolved from the server),
        `/problems/gateway-token-refused` (401 or 403),
        `/problems/gateway-not-kong` (the URL answers but isn't a Kong Admin API),
        `/problems/gateway-read-only` (DB-less mode or a data plane node),
        `/problems/gateway-proxy-unreachable` (the Admin API passed but the internal proxy URL failed),
        `/problems/gateway-token-required` (URL changed with a stored token; enter it again).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TryItNotAllowed:
      description: Missing `scalar_url`, or it isn't under a published API's base URL (`/problems/try-it-target-not-allowed`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TryItAccessDenied:
      description: |
        Kong refused the key because its app isn't subscribed to this API
        (`/problems/api-access-denied`). `title` and `detail` hold the copy from the UX design.
        Responses from the upstream service, including its own 403s, are not rewritten.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: Request body over the limit (`/problems/payload-too-large`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Rate limit exceeded (`/problems/rate-limited`)
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TryItTimeout:
      description: Gateway did not answer within 10 s (`/problems/try-it-timeout`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    GatewayRejected:
      description: Kong rejected the request with a 4xx (`/problems/gateway-rejected`). Nothing was changed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference, examples: ['/problems/gateway-unavailable'] }
        title: { type: string, examples: ['Gateway unavailable'] }
        status: { type: integer }
        detail: { type: string, examples: ["The API gateway didn't respond. Try again in a moment."] }
        instance: { type: string }
        apis: { type: integer, description: 'With `/problems/gateway-in-use`: published APIs on this gateway' }
        activeKeys: { type: integer, description: 'With `/problems/gateway-in-use`: active keys on this gateway' }
        affectedKeys: { type: integer, description: 'With `/problems/gateway-keys-missing`: active keys with no consumer on the new Kong' }
        errors:
          type: array
          description: |
            Field or document errors. For `/problems/invalid-openapi`, only the first error is
            returned. For `/problems/openapi-lint-failed`, every error-severity finding up to 100;
            `errorCount` holds the full number.
          items:
            type: object
            required: [message]
            properties:
              pointer: { type: string, description: 'JSON Pointer into the request body or the OpenAPI document, e.g. /paths/~1pets/get/responses' }
              message: { type: string }
              rule: { type: string, description: 'Lint findings only. The Spectral rule name, e.g. operation-operationId-unique' }
              line: { type: integer, minimum: 1, description: 'Lint findings, and `/problems/invalid-openapi` syntax errors: 1-based line in `source` (or in the submitted document)' }
              column: { type: integer, minimum: 1, description: 'Lint findings, and `/problems/invalid-openapi` syntax errors: 1-based column in `source` (or in the submitted document)' }
              source: { type: [string, 'null'], description: Lint findings only. URL of the external file the finding is in; null for the imported document itself }
        errorCount: { type: integer, description: 'Only on `/problems/openapi-lint-failed`: total number of error findings' }
        teams:
          type: array
          description: 'With `/problems/team-needs-admin` from `DELETE /v1/me`: the teams where the caller is the only Admin and others are members'
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }

    Slug:
      type: string
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      minLength: 2
      maxLength: 64

    Liveness:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    Readiness:
      type: object
      required: [status, database]
      properties:
        status: { type: string, enum: [ok] }
        database: { type: string, enum: [ok] }
    Health:
      type: object
      required: [status, version, gateway, lint]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version:
          type: string
          description: |
            The server image version (`PORTAL_VERSION`, set from the release tag at image build,
            for example `0.8.0`); `dev` for an image built outside the release workflow.
          examples: ['0.8.0']
        lint:
          type: object
          required: [ruleset, status]
          properties:
            ruleset: { type: string, enum: [default, custom] }
            path: { type: string, description: The configured ruleset file (custom only) }
            status: { type: string, enum: [ok, error] }
            error:
              type: string
              description: Why the custom ruleset failed to load, naming the file. Present only when status is error.
              examples: ['/etc/portal/ruleset.yaml: file not found']
        gateway:
          oneOf:
            - type: 'null'
            - type: object
              required: [kind, reachable]
              properties:
                kind: { type: string, enum: [kong] }
                reachable: { type: boolean }
                version: { type: string }

    SetupStatus:
      type: object
      required: [adminRequired, setupTokenRequired]
      properties:
        adminRequired: { type: boolean, description: True until the first admin exists }
        setupTokenRequired: { type: boolean, description: True while an admin is required and `NODE_ENV=production` }

    CreateFirstAdminRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 128 }
        name: { type: string, minLength: 1, maxLength: 80, description: Defaults to Administrator }
        setupToken: { type: string, maxLength: 128, description: Required when `setupTokenRequired` is true }

    GatewayUrls:
      type: object
      required: [adminUrl, proxyInternalUrl, proxyPublicUrl]
      properties:
        adminUrl: { type: string, format: uri, pattern: '^https?://', examples: ['http://kong:8001'] }
        proxyInternalUrl:
          type: string
          format: uri
          pattern: '^https?://'
          description: Address of Kong's proxy as the server reaches it. Used by try-it. Checked.
          examples: ['http://kong:8000']
        proxyPublicUrl:
          type: string
          format: uri
          pattern: '^https?://'
          description: Address developers call, shown in the catalog. The server can't check it from inside, so only its form is validated.
          examples: ['http://localhost:8000']

    Gateway:
      allOf:
        - $ref: '#/components/schemas/GatewayUrls'
        - type: object
          required: [id, kind, hasAdminToken, enabled, managedBy, sampleAvailable, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            kind: { type: string, enum: [kong] }
            hasAdminToken: { type: boolean, description: Whether a token is stored. The token itself is never returned. }
            enabled: { type: boolean }
            managedBy:
              type: string
              enum: [admin, env]
              description: '`env`: set by `KONG_ADMIN_URL`, so editing, disabling and removing are refused.'
            sampleAvailable: { type: boolean, description: Whether `addSampleApi` would be accepted }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    GatewayList:
      type: object
      required: [items, bundled]
      properties:
        items:
          type: array
          maxItems: 1
          items: { $ref: '#/components/schemas/Gateway' }
        bundled:
          description: The bundled Kong's values for the form. Null when this install has none.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/GatewayUrls'

    CreateGatewayRequest:
      allOf:
        - $ref: '#/components/schemas/GatewayUrls'
        - type: object
          properties:
            adminToken: { type: string, minLength: 1, maxLength: 1024, writeOnly: true, description: Optional; sent as `Kong-Admin-Token` }

    TestGatewayRequest:
      allOf:
        - $ref: '#/components/schemas/GatewayUrls'
        - type: object
          properties:
            gatewayId: { type: string, format: uuid, description: The connection being edited. Omit for a new one. }
            adminToken:
              description: A new token. Absent or empty keeps the stored one if the URL is unchanged. Null means this connection uses no token.
              writeOnly: true
              oneOf:
                - { type: string, maxLength: 1024 }
                - { type: 'null' }

    UpdateGatewayRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        adminUrl: { type: string, format: uri, pattern: '^https?://' }
        adminToken:
          description: A new token. Absent or empty keeps the stored one if the URL is unchanged. Null removes it, and the connection uses no token.
          writeOnly: true
          oneOf:
            - { type: string, maxLength: 1024 }
            - { type: 'null' }
        proxyInternalUrl: { type: string, format: uri, pattern: '^https?://' }
        proxyPublicUrl: { type: string, format: uri, pattern: '^https?://' }
        enabled: { type: boolean }
        confirmMissingKeys: { type: boolean, description: The admin accepted that active keys won't work on this Kong }

    GatewayTestResult:
      type: object
      required: [version, warnings]
      properties:
        version: { type: string, description: Kong version, examples: ['3.9.4'] }
        warnings:
          type: array
          description: Empty when there is nothing to report, including when there are no active keys.
          items:
            type: object
            required: [code, message, affectedKeys]
            properties:
              code: { type: string, enum: [active-keys-missing] }
              message: { type: string }
              affectedKeys: { type: integer, minimum: 1 }

    User:
      type: object
      required: [id, email, name, role, emailVerified, pendingEmail, verificationRequired, currentTeamId]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email, description: The address the account signs in with }
        name: { type: string }
        role: { type: string, enum: [developer, admin] }
        emailVerified: { type: boolean }
        pendingEmail:
          type: [string, 'null']
          format: email
          description: New address waiting for its confirmation link, if an email change is in progress and its link hasn't expired
        verificationRequired:
          type: boolean
          description: The admin's "Require a verified email" setting. With `emailVerified` false, creating apps and keys is refused.
        currentTeamId:
          type: string
          format: uuid
          description: The team picked most recently in the switcher; the personal team for a new account (spec 008)

    UpdateMeRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: Trimmed before saving }

    EmailChangeRequest:
      type: object
      required: [newEmail]
      additionalProperties: false
      properties:
        newEmail: { type: string, format: email, maxLength: 254, description: Trimmed and lower-cased }

    DeleteMeRequest:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password: { type: string, minLength: 1, maxLength: 128 }

    SmtpSecurity:
      type: string
      enum: [none, starttls, tls]
      description: '`none`: plain SMTP. `starttls`: upgrade with STARTTLS, required (usually port 587). `tls`: TLS from the start (usually port 465).'

    SmtpSettingsView:
      type: object
      required: [host, port, security, username, hasPassword, senderName, senderAddress]
      properties:
        host: { type: string }
        port: { type: integer }
        security: { $ref: '#/components/schemas/SmtpSecurity' }
        username: { type: [string, 'null'] }
        hasPassword: { type: boolean }
        senderName: { type: string }
        senderAddress: { type: string, format: email }

    MailSettings:
      type: object
      required: [source, saved, environment]
      properties:
        source: { type: string, enum: [saved, environment, none], description: Which settings portal email uses now }
        saved:
          description: Settings saved in the admin UI, or null
          oneOf:
            - $ref: '#/components/schemas/SmtpSettingsView'
            - type: 'null'
        updatedAt: { type: [string, 'null'], format: date-time }
        environment:
          description: Settings from `SMTP_*` environment variables, or null when `SMTP_HOST` or `SMTP_SENDER_ADDRESS` is unset. Read-only.
          oneOf:
            - $ref: '#/components/schemas/SmtpSettingsView'
            - type: 'null'

    SaveMailSettingsRequest:
      type: object
      required: [host, port, security, senderName, senderAddress]
      additionalProperties: false
      properties:
        host: { type: string, minLength: 1, maxLength: 253 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        security: { $ref: '#/components/schemas/SmtpSecurity' }
        username: { type: [string, 'null'], maxLength: 254 }
        password:
          type: [string, 'null']
          maxLength: 1024
          writeOnly: true
          description: Omit to keep the stored password; null removes it. Never returned.
        senderName: { type: string, minLength: 1, maxLength: 100 }
        senderAddress: { type: string, format: email, maxLength: 254 }

    RateLimit:
      type: object
      required: [max, windowMinutes]
      additionalProperties: false
      properties:
        max: { type: integer, minimum: 1, maximum: 1000 }
        windowMinutes: { type: integer, minimum: 1, maximum: 1440 }

    AccountRateLimits:
      type: object
      required: [signInFailures, passwordResetEmails, verificationEmails]
      additionalProperties: false
      properties:
        signInFailures:
          allOf: [{ $ref: '#/components/schemas/RateLimit' }]
          description: Failed sign-ins per email address. Default 10 in 15 minutes.
        passwordResetEmails:
          allOf: [{ $ref: '#/components/schemas/RateLimit' }]
          description: Password reset requests per email address. Default 3 in 60 minutes.
        verificationEmails:
          allOf: [{ $ref: '#/components/schemas/RateLimit' }]
          description: Verification email resends and email change requests per account. Default 3 in 60 minutes.

    SaveAccountSettingsRequest:
      type: object
      required: [requireVerifiedEmail, rateLimits]
      additionalProperties: false
      properties:
        requireVerifiedEmail: { type: boolean }
        rateLimits: { $ref: '#/components/schemas/AccountRateLimits' }

    AccountSettings:
      allOf:
        - $ref: '#/components/schemas/SaveAccountSettingsRequest'
        - type: object
          required: [mailConfigured]
          properties:
            mailConfigured:
              type: boolean
              description: SMTP settings are saved or set in the environment. `requireVerifiedEmail` can't be turned on without them.

    ApiSummary:
      type: object
      required: [id, slug, title, version, gatewayBaseUrl, publishedAt]
      properties:
        id: { type: string, format: uuid }
        slug: { $ref: '#/components/schemas/Slug' }
        title: { type: string, description: The latest version's info.title }
        version: { type: string, description: The latest version's info.version }
        description: { type: [string, 'null'], description: The latest version's info.description (Markdown) }
        gatewayBaseUrl: { type: string, format: uri, examples: ['http://localhost:8000/sample'] }
        publishedAt: { type: string, format: date-time, description: When the API's first version was published }

    ApiDetail:
      allOf:
        - $ref: '#/components/schemas/ApiSummary'
        - type: object
          required: [documentUrl, gatewayService, versions]
          properties:
            documentUrl: { type: string, description: The latest version's document, examples: ['/api/v1/apis/sample/openapi.json'] }
            versions:
              type: array
              description: |
                Every version, in version order: highest first by semantic-version precedence when
                every version name is a valid SemVer 2.0 string, otherwise newest import first.
                Exactly one has `isLatest` true.
              items: { $ref: '#/components/schemas/ApiVersionSummary' }
            gatewayService:
              type: object
              required: [id, name]
              properties:
                id: { type: string }
                name: { type: string }

    ImportedApi:
      allOf:
        - $ref: '#/components/schemas/ApiDetail'
        - type: object
          required: [warnings, lintWarnings]
          properties:
            warnings:
              type: array
              description: Published, but the admin should know this. Empty when there is nothing to report.
              items: { $ref: '#/components/schemas/ImportWarning' }
            lintWarnings:
              type: array
              description: Non-blocking lint findings, in document order, up to 200. Empty when there are none.
              items: { $ref: '#/components/schemas/LintFinding' }

    ApiVersionName:
      type: string
      description: |
        The document's `info.version`. Restricted so it can be used in URLs: starts with a letter
        or digit, then letters, digits, `.`, `_`, `-` or `+`, at most 64 characters.
      pattern: '^[A-Za-z0-9][A-Za-z0-9._+-]{0,63}$'
      examples: ['2.0.0', '2024-06-01', 'v2']

    ApiVersionSummary:
      type: object
      required: [version, isLatest, publishedAt, documentUrl]
      properties:
        version: { $ref: '#/components/schemas/ApiVersionName' }
        isLatest: { type: boolean }
        publishedAt: { type: string, format: date-time, description: When this version was imported }
        documentUrl: { type: string, examples: ['/api/v1/apis/orders/versions/1.0.0/openapi.json'] }

    ImportedApiVersion:
      type: object
      required: [api, version, lintWarnings]
      properties:
        api: { $ref: '#/components/schemas/ApiDetail' }
        version: { $ref: '#/components/schemas/ChangelogEntry' }
        lintWarnings:
          type: array
          description: Non-blocking lint findings, in document order, up to 200. Empty when there are none.
          items: { $ref: '#/components/schemas/LintFinding' }

    LintFinding:
      type: object
      required: [rule, severity, message, pointer, line, column]
      properties:
        rule: { type: string, examples: ['operation-description'] }
        severity: { type: string, enum: [error, warning], description: Spectral info and hint findings are reported as warning }
        message: { type: string }
        pointer: { type: string, description: JSON Pointer into the document, examples: ['/paths/~1orders/get'] }
        line: { type: integer, minimum: 1 }
        column: { type: integer, minimum: 1 }
        source: { type: [string, 'null'], description: URL of the external file the finding is in; null for the imported document itself }

    ChangelogEntry:
      type: object
      required: [version, publishedAt, releaseNote, changes]
      properties:
        version: { $ref: '#/components/schemas/ApiVersionName' }
        publishedAt: { type: string, format: date-time, description: The import date }
        releaseNote: { type: [string, 'null'], description: 'The admin''s note, plain text (rendered without HTML)' }
        changes:
          description: Null for the first version, or when no version sorted below this one at import time.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ChangeSummary'

    ChangeSummary:
      type: object
      required: [comparedTo, added, removed, changed, breaking]
      properties:
        comparedTo: { $ref: '#/components/schemas/ApiVersionName' }
        added: { type: array, items: { $ref: '#/components/schemas/OperationChange' } }
        removed:
          type: array
          description: Every removed operation is breaking.
          items: { $ref: '#/components/schemas/OperationChange' }
        changed: { type: array, items: { $ref: '#/components/schemas/OperationChange' } }
        breaking: { type: boolean, description: True if any removed or changed operation is breaking }

    OperationChange:
      type: object
      required: [method, path, breaking, reasons]
      properties:
        method: { type: string, enum: [GET, PUT, POST, DELETE, OPTIONS, HEAD, PATCH, TRACE] }
        path: { type: string, examples: ['/orders/{id}'] }
        summary: { type: [string, 'null'] }
        breaking: { type: boolean }
        reasons:
          type: array
          description: Empty for added operations; `operation-removed` for removed ones.
          items:
            type: object
            required: [code, message]
            properties:
              code:
                type: string
                enum:
                  - operation-removed
                  - required-parameter-added
                  - parameter-became-required
                  - request-body-became-required
                  - success-response-removed
                  - parameter-removed
                  - optional-parameter-added
                  - security-changed
                  - deprecated
              message: { type: string, examples: ['New required query parameter `status`'] }

    ImportApiVersionRequest:
      type: object
      required: [spec]
      additionalProperties: false
      properties:
        spec: { $ref: '#/components/schemas/SpecSource' }
        releaseNote: { type: string, maxLength: 5000, description: Plain text shown in the changelog }
        makeLatest:
          type: boolean
          default: true
          description: False for "Don't make this the default version"

    SetLatestVersionRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { $ref: '#/components/schemas/ApiVersionName' }

    SpecSource:
      description: Exactly one of `url` or `content`
      oneOf:
        - type: object
          required: [url]
          additionalProperties: false
          properties:
            url: { type: string, format: uri, pattern: '^https?://' }
        - type: object
          required: [content]
          additionalProperties: false
          properties:
            content: { type: string, maxLength: 5242880, description: OpenAPI document as YAML or JSON text (5 MiB max) }

    ImportWarning:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [api-public, partial-key-auth]
          description: |
            `api-public`: the service has no key-auth, so anyone can call this API without a key.
            `partial-key-auth`: key-auth is only on some of the service's routes, so the other routes stay open.
        message: { type: string }

    ImportApiRequest:
      type: object
      required: [spec, gatewayServiceId]
      additionalProperties: false
      properties:
        spec: { $ref: '#/components/schemas/SpecSource' }
        releaseNote: { type: string, maxLength: 5000, description: Plain text shown in the changelog for the first version }
        gatewayServiceId:
          type: string
          description: Kong service ID or name, from GET /v1/admin/gateway/services
        slug:
          $ref: '#/components/schemas/Slug'
          description: Defaults to a slug of info.title
        routePath:
          type: string
          pattern: '^/'
          description: Public path prefix on the gateway. Defaults to the first path of the service's first route.

    GatewayService:
      type: object
      required: [id, name, routes, keyAuth]
      properties:
        id: { type: string }
        name: { type: string }
        routes:
          type: array
          items:
            type: object
            required: [id, paths]
            properties:
              id: { type: string }
              name: { type: [string, 'null'] }
              paths: { type: array, items: { type: string } }
        keyAuth: { type: boolean, description: True if an enabled key-auth plugin applies to the service, one of its routes, or globally }
        linkedApiSlug:
          type: [string, 'null']
          description: Slug of the published API already linked to this service. Importing another API onto it is refused with `/problems/gateway-service-already-linked`; add a version to that API instead (`importApiVersion`).

    TeamRole:
      type: string
      enum: [admin, member, read-only]

    CreateTeamRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80, description: Trimmed before saving; need not be unique }

    SetCurrentTeamRequest:
      type: object
      required: [teamId]
      additionalProperties: false
      properties:
        teamId: { type: string, format: uuid }

    TeamSummary:
      type: object
      required: [id, name, personal, role, memberCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: '`Personal` for a personal team' }
        personal: { type: boolean, description: The caller's personal team. Single-member; takes no invitations. }
        role: { $ref: '#/components/schemas/TeamRole' }
        memberCount: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }

    TeamMember:
      type: object
      required: [userId, name, email, role, joinedAt]
      properties:
        userId: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/TeamRole' }
        joinedAt: { type: string, format: date-time }

    TeamDetail:
      allOf:
        - $ref: '#/components/schemas/TeamSummary'
        - type: object
          required: [members, invitations]
          properties:
            members:
              type: array
              description: Admins first, then by name
              items: { $ref: '#/components/schemas/TeamMember' }
            invitations:
              type: [array, 'null']
              description: Pending, unexpired invitations, newest first. `null` unless the caller is an Admin.
              items: { $ref: '#/components/schemas/Invitation' }

    CreateInvitationRequest:
      type: object
      required: [email, role]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254, description: Trimmed and lowercased }
        role: { $ref: '#/components/schemas/TeamRole' }

    UpdateTeamMemberRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: { $ref: '#/components/schemas/TeamRole' }

    Invitation:
      type: object
      required: [id, email, role, invitedBy, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/TeamRole' }
        invitedBy:
          type: [object, 'null']
          description: '`null` if the inviter''s account was deleted'
          required: [userId, name]
          properties:
            userId: { type: string, format: uuid }
            name: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: 7 days after `createdAt` }

    InvitationTokenRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string, minLength: 1, maxLength: 200 }

    InvitationPreview:
      type: object
      required: [teamName, role, email, invitedByName, expiresAt, state]
      properties:
        teamName: { type: string }
        role: { $ref: '#/components/schemas/TeamRole' }
        email: { type: string, format: email, description: The invited address; sign in or sign up with it to accept }
        invitedByName: { type: [string, 'null'] }
        expiresAt: { type: string, format: date-time }
        state:
          type: string
          enum: [pending, accepted, cancelled, expired]

    CreateAppRequest:
      type: object
      required: [name, apiIds]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        teamId:
          type: string
          format: uuid
          description: The team the app belongs to. Defaults to the caller's current team; the portal always sends it.
        apiIds:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items: { type: string, format: uuid }

    App:
      type: object
      required: [id, teamId, role, name, subscriptions, credentials, createdAt]
      properties:
        id: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        role:
          $ref: '#/components/schemas/TeamRole'
          description: The caller's role in the app's team. `read-only` can't create or revoke keys.
        name: { type: string }
        description: { type: [string, 'null'] }
        subscriptions:
          type: array
          items:
            type: object
            required: [apiId, slug, title]
            properties:
              apiId: { type: string, format: uuid }
              slug: { $ref: '#/components/schemas/Slug' }
              title: { type: string }
        credentials:
          type: array
          description: Active and revoked keys, newest first. Never includes the key value.
          items: { $ref: '#/components/schemas/Credential' }
        createdAt: { type: string, format: date-time }

    Credential:
      type: object
      required: [id, kind, keyHint, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [api-key] }
        keyHint: { type: string, description: 'Last 4 characters of the key, shown as …9fQa', examples: ['9fQa'] }
        status: { type: string, enum: [active, revoked] }
        createdAt: { type: string, format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }

    IssuedCredential:
      allOf:
        - $ref: '#/components/schemas/Credential'
        - type: object
          required: [key, headerName]
          properties:
            key:
              type: string
              description: The full API key, `pk_` + 43 base64url characters. Returned only here, once.
              examples: ['pk_3q2-7wErT...']
            headerName: { type: string, description: Header to send it in, examples: ['apikey'] }

    CreateAppResponse:
      type: object
      required: [app, credential]
      properties:
        app: { $ref: '#/components/schemas/App' }
        credential: { $ref: '#/components/schemas/IssuedCredential' }

security:
  - sessionCookie: []
