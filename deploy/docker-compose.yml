# Plain `docker compose up` keeps project "portal" and ports 3000, 4000, 8000, 8001.
# Parallel worktrees use `node scripts/worktree-compose.mjs` so project, images, and ports differ.
name: ${COMPOSE_PROJECT_NAME:-portal}
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portal}
      POSTGRES_DB: portal
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-kong.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U portal -d portal]
      interval: 2s
      timeout: 3s
      retries: 30
  kong-migrations:
    image: kong:3.9
    command: kong migrations bootstrap
    environment: &kong-env
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres
      KONG_PG_USER: portal
      KONG_PG_PASSWORD: ${POSTGRES_PASSWORD:-portal}
      KONG_PG_DATABASE: kong
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
  kong:
    image: kong:3.9
    environment:
      <<: *kong-env
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      # Apply new ACLs before serving a request on any worker, including pooled
      # try-it connections. Eventual workers can briefly bypass imported ACLs.
      KONG_WORKER_CONSISTENCY: strict
      KONG_TRACING_INSTRUMENTATIONS: ${KONG_TRACING_INSTRUMENTATIONS:-request,router,balancer,plugin_access}
      KONG_TRACING_SAMPLING_RATE: ${KONG_TRACING_SAMPLING_RATE:-1}
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    ports:
      - '${KONG_PROXY_PORT:-8000}:8000'
      - '127.0.0.1:${KONG_ADMIN_PORT:-8001}:8001'
    depends_on:
      kong-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, kong, health]
      interval: 2s
      timeout: 5s
      retries: 30
  httpbin:
    image: mccutchen/go-httpbin:v2.15.0
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - '127.0.0.1:8025:8025'
  server:
    image: ${PORTAL_SERVER_IMAGE:-portal-server}
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    environment:
      # INSECURE local evaluation defaults. Production rejects these secrets.
      NODE_ENV: development
      DATABASE_URL: postgres://portal:${POSTGRES_PASSWORD:-portal}@postgres:5432/portal
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-INSECURE-local-auth-secret-change-me-123456}
      PORTAL_ENCRYPTION_KEY: ${PORTAL_ENCRYPTION_KEY:-AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=}
      PORTAL_PROXY_HOST: portal
      PORTAL_PUBLIC_URL: ${PORTAL_PUBLIC_URL:-http://localhost:3000}
      PORTAL_RATE_LIMIT_RESET: ${PORTAL_RATE_LIMIT_RESET:-local-rate-limit-reset}
      KONG_ADMIN_URL: ${KONG_ADMIN_URL:-}
      PORTAL_BUNDLED_KONG_ADMIN_URL: http://kong:8001
      KONG_ADMIN_TOKEN: ${KONG_ADMIN_TOKEN:-}
      PORTAL_USAGE_INGEST_URL: ${PORTAL_USAGE_INGEST_URL:-http://server:4000/api/v1/internal/usage/kong}
      PORTAL_TRACE_INGEST_URL: ${PORTAL_TRACE_INGEST_URL:-http://server:4000/api/v1/internal/traces/kong}
      PORTAL_USAGE_RETENTION_DAYS: ${PORTAL_USAGE_RETENTION_DAYS:-400}
      KONG_PROXY_INTERNAL_URL: ${KONG_PROXY_INTERNAL_URL:-http://kong:8000}
      KONG_PROXY_PUBLIC_URL: ${KONG_PROXY_PUBLIC_URL:-http://localhost:8000}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURITY: ${SMTP_SECURITY:-none}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-Developer Portal}
      SMTP_SENDER_ADDRESS: ${SMTP_SENDER_ADDRESS:-noreply@example.com}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_SAMPLE: ${SEED_SAMPLE:-false}
    ports:
      - '127.0.0.1:${PORTAL_API_PORT:-4000}:4000'
    depends_on:
      postgres:
        condition: service_healthy
      kong:
        condition: service_healthy
      httpbin:
        condition: service_started
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:4000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 6s
      retries: 30
  portal:
    image: ${PORTAL_WEB_IMAGE:-portal-web}
    build:
      context: ..
      dockerfile: apps/portal/Dockerfile
    environment:
      SERVER_URL: http://server:4000
      PORT: '3000'
      HOSTNAME: 0.0.0.0
    ports:
      - '${PORTAL_WEB_PORT:-3000}:3000'
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres-data:
