{{- if .Values.ingress.enabled }}
{{- $url := include "api-portal.publicUrl" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: {{ include "api-portal.fullname" . }} }
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{ toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required when ingress.enabled is true" .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ include "api-portal.fullname" . }}-portal, port: { number: 3000 } }
{{- end }}
