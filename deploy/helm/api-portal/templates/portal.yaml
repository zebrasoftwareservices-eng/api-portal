apiVersion: v1
kind: Service
metadata: { name: {{ include "api-portal.fullname" . }}-portal }
spec:
  selector: { app.kubernetes.io/component: portal, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: http, port: 3000, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata: { name: {{ include "api-portal.fullname" . }}-portal-headless }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/component: portal, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: http, port: 3000, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ include "api-portal.fullname" . }}-portal }
spec:
  replicas: {{ .Values.portal.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/component: portal, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/component: portal, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 8 }}
      securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: portal
          image: {{ .Values.image.registry }}/api-portal-portal:{{ include "api-portal.tag" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: {{ toYaml .Values.portal.resources | nindent 12 }}
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: SERVER_URL, value: "http://{{ include "api-portal.fullname" . }}-server:4000" }
            - { name: PORTAL_VERSION, value: {{ include "api-portal.tag" . | quote }} }
          livenessProbe: { httpGet: { path: /healthz, port: http } }
          readinessProbe: { httpGet: { path: /healthz, port: http } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
