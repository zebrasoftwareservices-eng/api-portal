{{- if not .Values.secrets.existingSecret }}
{{- $name := include "api-portal.secret" . -}}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "api-portal.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  auth-secret: {{ if $old }}{{ index $old.data "auth-secret" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
  encryption-key: {{ if $old }}{{ index $old.data "encryption-key" }}{{ else }}{{ randBytes 32 | b64enc }}{{ end }}
  db-password: {{ if $old }}{{ index $old.data "db-password" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
{{- end }}
