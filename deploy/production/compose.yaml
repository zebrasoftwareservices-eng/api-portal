name: api-portal
x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: '3' }
x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: *logging
services:
  postgres:
    image: postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
    restart: unless-stopped
    environment:
      POSTGRES_USER: portal
      POSTGRES_DB: portal
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U portal -d portal]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging
  server:
    <<: *hardened
    image: ghcr.io/zebrasoftwareservices-eng/api-portal-server:${PORTAL_VERSION:?Set PORTAL_VERSION}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://portal@postgres:5432/portal
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
      BETTER_AUTH_SECRET_FILE: /run/secrets/auth_secret
      PORTAL_ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
      KONG_ADMIN_TOKEN_FILE: /run/secrets/kong_admin_token
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      PORTAL_VERSION: ${PORTAL_VERSION:?Set PORTAL_VERSION}
      PORTAL_PUBLIC_URL: ${PORTAL_PUBLIC_URL:?Set PORTAL_PUBLIC_URL}
      PORTAL_PROXY_HOST: portal
      KONG_ADMIN_URL: ${KONG_ADMIN_URL:-}
      KONG_PROXY_INTERNAL_URL: ${KONG_PROXY_INTERNAL_URL:-http://localhost:8000}
      KONG_PROXY_PUBLIC_URL: ${KONG_PROXY_PUBLIC_URL:-http://localhost:8000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_SENDER_ADDRESS: ${SMTP_SENDER_ADDRESS:-}
      SEED_SAMPLE: 'false'
    secrets: [db_password, auth_secret, encryption_key, kong_admin_token, smtp_password]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [database, app]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:4000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
  portal:
    <<: *hardened
    image: ghcr.io/zebrasoftwareservices-eng/api-portal-portal:${PORTAL_VERSION:?Set PORTAL_VERSION}
    environment:
      SERVER_URL: http://server:4000
      PORTAL_TRUSTED_PROXIES: 172.30.0.0/24
      PORTAL_VERSION: ${PORTAL_VERSION:?Set PORTAL_VERSION}
    ports: ["127.0.0.1:${PORTAL_HTTP_PORT:-3000}:3000"]
    networks: [app, edge]
    depends_on:
      server: { condition: service_healthy }
  caddy:
    <<: *hardened
    profiles: [caddy]
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    environment: { PORTAL_DOMAIN: "${PORTAL_DOMAIN:?Set PORTAL_DOMAIN}" }
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks: [edge]
networks:
  database: { internal: true }
  app: {}
  edge:
    ipam:
      config: [{ subnet: 172.30.0.0/24 }]
volumes:
  postgres_data: {}
  caddy_data: {}
secrets:
  db_password: { file: ./secrets/db_password }
  auth_secret: { file: ./secrets/auth_secret }
  encryption_key: { file: ./secrets/encryption_key }
  kong_admin_token: { file: ./secrets/kong_admin_token }
  smtp_password: { file: ./secrets/smtp_password }
