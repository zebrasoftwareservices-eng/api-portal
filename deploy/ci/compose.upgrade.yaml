services:
  server:
    image: ${SERVER_IMAGE:-portal-server:candidate}
    environment:
      DATABASE_URL: postgres://portal:upgrade-db-password@postgres:5432/portal
      DATABASE_PASSWORD_FILE: null
      BETTER_AUTH_SECRET: upgrade-auth-secret-change-me-1234567890
      BETTER_AUTH_SECRET_FILE: null
      PORTAL_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
      PORTAL_ENCRYPTION_KEY_FILE: null
      KONG_ADMIN_TOKEN_FILE: null
      SMTP_PASSWORD_FILE: null
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-upgrade-password}
      KONG_ADMIN_URL: http://kong:8001
      KONG_PROXY_INTERNAL_URL: http://kong:8000
      KONG_PROXY_PUBLIC_URL: http://127.0.0.1:8000
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:4000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
  portal:
    image: ${PORTAL_IMAGE:-portal-portal:candidate}
  kong:
    image: kong:3.9
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /kong/declarative.yml
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes: [../kong.yml:/kong/declarative.yml:ro]
    networks: [app]
